<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>কাজী মোশাররফ টাওয়ার ভবন মালিক সমিতি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- ===================================================================
     SPLASH SCREEN
     =================================================================== -->
<div class="splash-overlay" id="splashOv">
  <div class="splash-content">
    <div class="splash-logo">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 54V22L32 10L50 22V54" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M14 54H50" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
        <rect x="22" y="30" width="6" height="6" rx="1" fill="#fff"/>
        <rect x="36" y="30" width="6" height="6" rx="1" fill="#fff"/>
        <rect x="22" y="42" width="6" height="6" rx="1" fill="#fff"/>
        <rect x="36" y="42" width="6" height="6" rx="1" fill="#fff"/>
        <path d="M32 10V4" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="32" cy="4" r="2" fill="#fff"/>
      </svg>
    </div>
    <h1 class="splash-title">কাজী মোশাররফ টাওয়ার ভবন মালিক সমিতি</h1>
    <p class="splash-sub">অ্যাকাউন্টিং ম্যানেজমেন্ট সিস্টেম</p>
    <div class="splash-bar"></div>
    <div class="splash-pct" id="splashPct">0%</div>
  </div>
</div>

<!-- ===================================================================
     LOGIN SCREEN
     =================================================================== -->
<div class="login-overlay" id="loginOv" hidden>
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="login-head">
      <div class="login-logo">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 54V22L32 10L50 22V54" stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M14 54H50" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
          <rect x="22" y="30" width="6" height="6" rx="1" fill="#fff"/>
          <rect x="36" y="30" width="6" height="6" rx="1" fill="#fff"/>
          <rect x="22" y="42" width="6" height="6" rx="1" fill="#fff"/>
          <rect x="36" y="42" width="6" height="6" rx="1" fill="#fff"/>
        </svg>
      </div>
      <h1>কাজী মোশাররফ টাওয়ার ভবন মালিক সমিতি</h1>
      <p>অ্যাকাউন্টিং ম্যানেজমেন্ট সিস্টেম</p>
    </div>

    <div class="field">
      <label for="loginUser">ইউজারনেম</label>
      <input type="text" id="loginUser" autocomplete="username" required
             placeholder="ইউজারনেম লিখুন" autocapitalize="off" spellcheck="false">
    </div>

    <div class="field">
      <label for="loginPw">পাসওয়ার্ড</label>
      <div class="input-wrap">
        <input type="password" id="loginPw" autocomplete="current-password"
               required placeholder="••••••••">
        <button type="button" class="toggle-pw" id="togglePw" aria-label="পাসওয়ার্ড দেখান">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <p class="login-msg" id="loginMsg"></p>

    <button type="submit" class="btn-login" id="loginBtn">
      <span class="spinner"></span>
      <span class="btn-text">লগইন করুন</span>
    </button>
  </form>
</div>

<!-- ===================================================================
     APP SHELL (login-এর পরে দেখাবে)
     =================================================================== -->
<div class="app" id="appShell" hidden>
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 54V22L32 10L50 22V54" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M14 54H50" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
          <rect x="22" y="30" width="6" height="6" rx="1" fill="#fff"/>
          <rect x="36" y="30" width="6" height="6" rx="1" fill="#fff"/>
          <rect x="22" y="42" width="6" height="6" rx="1" fill="#fff"/>
          <rect x="36" y="42" width="6" height="6" rx="1" fill="#fff"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>কাজী মোশাররফ টাওয়ার</h1>
        <small>ভবন মালিক সমিতি</small>
      </div>
    </div>
    <div class="user-bar" id="userBar">
      <span id="userName">—</span>
      <button type="button" id="btnChangePw" class="icon-btn" title="পাসওয়ার্ড পরিবর্তন">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 1 1 8 0v4"/>
        </svg>
      </button>
      <button type="button" id="btnLogout" class="icon-btn" title="লগআউট">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="app-main">
    <div class="placeholder">
      <h2>স্বাগতম! 🎉</h2>
      <p>Database সংযোগ সফল হয়েছে।</p>
      <p style="font-size:.85rem;color:var(--mute);margin-top:20px">
        পরবর্তী ধাপে Dashboard, Entry, Reports যোগ করা হবে।
      </p>
    </div>
  </main>
</div>

<!-- ===================================================================
     TOAST
     =================================================================== -->
<div class="toast" id="toast" role="status"></div>

<!-- ===================================================================
     SCRIPTS (ES Modules)
     =================================================================== -->
<script type="module" src="js/app.js"></script>

</body>
</html>
